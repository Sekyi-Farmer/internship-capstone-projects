services:
  healthlogger:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      HEALTHLOGGER_SPEC: /app/config/client-spec.json
      HEALTHLOGGER_STORE: /app/data/events.jsonl
    volumes:
      - healthlogger-data:/app/data
    restart: unless-stopped

volumes:
  healthlogger-data:
