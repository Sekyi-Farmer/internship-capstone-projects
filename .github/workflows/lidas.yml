name: LIDAS

on:
  push:
    branches: [main, "intern/**"]
    paths:
      - "lidas/**"
      - ".github/workflows/lidas.yml"
  pull_request:
    branches: [main, "intern/**"]
    paths:
      - "lidas/**"
      - ".github/workflows/lidas.yml"

defaults:
  run:
    working-directory: lidas

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - run: pytest tests/ -v --cov=lidas --cov-report=term-missing

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python"

  container-scan:
    runs-on: ubuntu-latest
    needs: [test]
    if: hashFiles('lidas/Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lidas:ci .
        working-directory: lidas
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: "lidas:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
