name: ConfigMaster

on:
  push:
    branches: [main, "intern/**"]
    paths:
      - "configmaster/**"
      - ".github/workflows/configmaster.yml"
  pull_request:
    branches: [main, "intern/**"]
    paths:
      - "configmaster/**"
      - ".github/workflows/configmaster.yml"

defaults:
  run:
    working-directory: configmaster

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: "p/java"

  container-scan:
    runs-on: ubuntu-latest
    needs: [test]
    if: hashFiles('configmaster/Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t configmaster:ci .
        working-directory: configmaster
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: "configmaster:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
